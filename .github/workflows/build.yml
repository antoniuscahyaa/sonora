name: Build Sonora

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: Jenis build
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract Sonora.zip
        run: |
          if [ -f Sonora.zip ]; then
            unzip -o Sonora.zip -x '.github/*' -d .
          else
            echo "Sonora.zip tidak ada, lanjut memakai file yang ada di repo."
          fi

      - name: Cari folder proyek Gradle
        id: proj
        run: |
          echo "Isi root repo:"
          ls -la
          F=$(find . -maxdepth 3 -name settings.gradle.kts -not -path '*/node_modules/*' | head -n1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan. File proyek belum ter-upload ke repo (cek folder app/, build.gradle.kts, settings.gradle.kts)."
            exit 1
          fi
          D=$(dirname "$F")
          echo "Proyek ditemukan di: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan keystore
        id: ks
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
              || { echo "::error::Keystore, alias, atau password tidak cocok. Cek lagi secrets-nya."; exit 1; }
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi, jadi APK memakai debug key (bukan keystore Anda)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        id: build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ "${{ steps.ks.outputs.signed }}" = "true" ] && [ "${{ inputs.build_type }}" != "debug" ]; then
            gradle assembleRelease --no-daemon --stacktrace
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            gradle assembleDebug --no-daemon --stacktrace
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Beri nama APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          VN=$(grep -m1 versionName app/build.gradle.kts | sed 's/[^"]*"\([^"]*\)".*/\1/')
          V=${{ steps.build.outputs.variant }}
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/$V/*.apk "$GITHUB_WORKSPACE/out/Sonora-$VN-$V.apk"
          ls -l "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: Sonora-APK
          path: out/*.apk

      - name: Rilis di GitHub (khusus tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
